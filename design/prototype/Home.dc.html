<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travether — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D93A4A;text-decoration:none}a:hover{color:#B02C3A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Rubik', system-ui, sans-serif; color: #222222; overflow: hidden">
  <div style="flex: 1; overflow-y: auto">
    <div style="padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between">
      <div>
        <div style="font-size: 14px; color: #6A6A6A">Hi Noa</div>
        <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-top: 2px">Your trips</div>
      </div>
      <a href="Inbox.dc.html" aria-label="Notifications" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #EBEBEB; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>
        <span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 999px; background: #D93A4A; border: 2px solid #FFFFFF"></span>
      </a>
    </div>

    <div style="margin: 16px 20px 0; padding: 12px 14px; border-radius: 14px; background: #F7F7F7; display: flex; align-items: center; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
      <div style="flex: 1; font-size: 13px; line-height: 1.4">Add Travether to your Home Screen to get join requests instantly.</div>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #222222; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">How</button>
    </div>

    <a href="Card.dc.html" style="display: block; margin: 16px 20px 0; border-radius: 20px; overflow: hidden; border: 1px solid #EBEBEB; color: #222222">
      <div style="height: 150px; position: relative; background: #F3E3CF">
        <svg width="350" height="150" viewBox="0 0 350 150" style="position: absolute; inset: 0"><circle cx="70" cy="48" r="22" fill="#F7C98B"/><path d="M0 112 L60 80 L110 104 L170 62 L230 100 L290 74 L350 96 L350 150 L0 150Z" fill="#D9B48C"/><path d="M150 150 L150 96 L162 84 L174 96 L174 150Z M186 150 L186 104 L196 94 L206 104 L206 150Z" fill="#B8865B"/></svg>
        <span style="position: absolute; top: 12px; left: 12px; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600">In 6 days</span>
      </div>
      <div style="padding: 14px 16px 16px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 18px; font-weight: 600">Chiang Mai Crew</div>
          <div style="font-size: 13px; color: #6A6A6A">Thailand</div>
        </div>
        <div style="font-size: 14px; color: #6A6A6A; margin-top: 4px">12 – 26 Oct · Chiang Mai, Pai</div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
          <div style="display: flex">
            <span style="width: 30px; height: 30px; border-radius: 999px; background: #FBE1DE; border: 2px solid #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">N</span>
            <span style="width: 30px; height: 30px; border-radius: 999px; background: #DDEBF7; border: 2px solid #FFFFFF; margin-left: -8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">I</span>
            <span style="width: 30px; height: 30px; border-radius: 999px; background: #E3EFE6; border: 2px solid #FFFFFF; margin-left: -8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">M</span>
          </div>
          <div style="display: flex; gap: 6px">
            <span style="font-size: 12px; font-weight: 500; background: #F7F7F7; border-radius: 999px; padding: 6px 10px">2 plans</span>
            <span style="font-size: 12px; font-weight: 600; color: #D93A4A; background: #FCEBEC; border-radius: 999px; padding: 6px 10px">1 request</span>
          </div>
        </div>
      </div>
    </a>

    <div style="margin: 12px 20px 0; display: flex; gap: 10px">
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 1px dashed #BBBBBB; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: #222222"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New Vacation Card</button>
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid #EBEBEB; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: #222222">Join with a code</button>
    </div>

    <div style="padding: 24px 20px 0; display: flex; align-items: baseline; justify-content: space-between">
      <div style="font-size: 18px; font-weight: 600">Matches for your dates</div>
      <a href="Discover.dc.html" style="font-size: 14px; font-weight: 500">See all</a>
    </div>
    <div style="padding: 12px 20px 20px; display: flex; gap: 12px; overflow-x: auto">
      <sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
        <a href="Plan.dc.html" style="flex: 0 0 200px; border-radius: 16px; border: 1px solid #EBEBEB; overflow: hidden; color: #222222">
          <div style="height: 90px; background: {{p.tint}}; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box"><span style="background: #FFFFFF; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 600">{{p.cat}}</span></div>
          <div style="padding: 10px 12px 12px">
            <div style="font-size: 14px; font-weight: 600; line-height: 1.3">{{p.title}}</div>
            <div style="font-size: 12px; color: #6A6A6A; margin-top: 4px">{{p.meta}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav style="height: 76px; border-top: 1px solid #EBEBEB; display: flex; align-items: center; justify-content: space-around; padding-bottom: 10px; box-sizing: border-box; background: #FFFFFF">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: #D93A4A; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #6A6A6A; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Discover</a>
    <a href="CreatePlan.dc.html" aria-label="Create a plan" style="width: 52px; height: 52px; border-radius: 999px; background: #D93A4A; display: flex; align-items: center; justify-content: center; margin-top: 4px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="Inbox.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #6A6A6A; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Inbox<span style="position: absolute; top: 2px; right: 10px; min-width: 18px; height: 18px; border-radius: 999px; background: #D93A4A; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #6A6A6A; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      plans: [
        { cat: 'Hike', tint: '#E3EFE6', title: 'Sunrise hike to Doi Suthep', meta: 'Tue 14 Oct · ~2 km' },
        { cat: 'Day trip', tint: '#DDEBF7', title: 'Elephant sanctuary', meta: 'Thu 16 Oct · ~4 km' },
        { cat: 'Class', tint: '#FBE7D9', title: 'Thai cooking class', meta: 'Sat 18 Oct · ~1 km' }
      ]
    };
  }
}
</script>
</body>
</html>
