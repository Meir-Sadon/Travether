<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travether — Share card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D93A4A;text-decoration:none}a:hover{color:#B02C3A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F7F7; font-family: 'Rubik', system-ui, sans-serif; color: #222222; overflow: hidden">
  <div style="padding: 16px 16px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="Card.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <div style="font-size: 16px; font-weight: 600">Invite to your trip</div>
    <div style="width: 44px"></div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 24px 24px 0">
    <div style="background: #FFFFFF; border-radius: 24px; overflow: hidden; border: 1px solid #EBEBEB">
      <div style="background: #D93A4A; color: #FFFFFF; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center">
        <div>
          <div style="font-size: 12px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500">Vacation Card</div>
          <div style="font-size: 22px; font-weight: 700; margin-top: 2px">Chiang Mai Crew</div>
        </div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 20a5 5 0 0 1 10 0M11 20a5 5 0 0 1 10 0"/></svg>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 16px 20px">
        <div><div style="font-size: 11px; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px">From</div><div style="font-size: 16px; font-weight: 600; margin-top: 2px">12 Oct</div></div>
        <div><div style="font-size: 11px; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px">To</div><div style="font-size: 16px; font-weight: 600; margin-top: 2px">26 Oct</div></div>
        <div><div style="font-size: 11px; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px">Where</div><div style="font-size: 16px; font-weight: 600; margin-top: 2px">TH</div></div>
      </div>
      <div style="position: relative; height: 0; border-top: 2px dashed #E2E2E2; margin: 0 16px"></div>
      <div style="padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="display: grid; grid-template-columns: repeat(21, 8px); gap: 0; padding: 10px; background: #FFFFFF; border: 1px solid #EBEBEB; border-radius: 12px">
          <sc-for list="{{qr}}" as="c" hint-placeholder-count="441">
            <div style="width: 8px; height: 8px; background: {{c}}"></div>
          </sc-for>
        </div>
        <div style="font-size: 13px; color: #6A6A6A">Scan to view and request to join</div>
        <div style="font-size: 14px; font-weight: 600; background: #F4F4F4; border-radius: 999px; padding: 8px 14px">travether.app/c/cm-crew-7K2</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px">
      <button onClick="{{copy}}" style="height: 76px; border-radius: 16px; border: 1px solid #EBEBEB; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: #222222"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>{{copyLabel}}</button>
      <button style="height: 76px; border-radius: 16px; border: 1px solid #EBEBEB; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: #222222"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>WhatsApp</button>
      <button style="height: 76px; border-radius: 16px; border: 1px solid #EBEBEB; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: #222222"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Save QR</button>
    </div>
    <p style="font-size: 13px; color: #6A6A6A; line-height: 1.5; text-align: center; margin: 18px 8px 24px">Anyone with the link can see the trip and request to join. You approve every request.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { copied: false }; }
  renderVals() {
    const n = 21, cells = [];
    const finder = (r, c) => {
      const inBox = (r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7;
      for (const [r0, c0] of [[0, 0], [0, 14], [14, 0]]) {
        if (inBox(r0, c0)) {
          const rr = r - r0, cc = c - c0;
          return (rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4)) ? 1 : 0;
        }
      }
      return -1;
    };
    let seed = 7;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const f = finder(r, c);
      seed = (seed * 9301 + 49297) % 233280;
      const on = f === -1 ? (seed / 233280) > 0.52 : f === 1;
      cells.push(on ? '#222222' : '#FFFFFF');
    }
    return {
      qr: cells,
      copyLabel: this.state.copied ? 'Copied' : 'Copy link',
      copy: () => this.setState({ copied: true })
    };
  }
}
</script>
</body>
</html>
