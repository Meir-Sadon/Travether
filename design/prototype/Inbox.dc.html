<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travether — Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E2F2C;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Rubik', system-ui, sans-serif; color: #222222; overflow: hidden">
  <div style="padding: 20px 20px 0">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.5px">Inbox</div>
    <div style="margin-top: 14px; display: flex; gap: 4px; background: #F4F4F4; border-radius: 999px; padding: 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button onClick="{{t.pick}}" style="flex: 1; height: 38px; border: none; border-radius: 999px; background: {{t.bg}}; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: #222222">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 16px 20px 20px">
    <sc-if value="{{onReq}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <a href="Review.dc.html" style="border-radius: 20px; background: #222222; color: #FFFFFF; padding: 16px; display: flex; align-items: center; gap: 12px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#F6C343"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>
          <div style="flex: 1"><div style="font-size: 15px; font-weight: 600">Did you meet Berlin Backpackers?</div><div style="font-size: 13px; color: #D0D0D0; margin-top: 2px">Elephant sanctuary · yesterday</div></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </a>
        <div style="font-size: 13px; font-weight: 600; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px">Waiting for you</div>
        <sc-for list="{{incoming}}" as="r" hint-placeholder-count="2">
          <div style="border-radius: 20px; border: 1px solid #EBEBEB; padding: 14px">
            <div style="display: flex; gap: 12px; align-items: center">
              <span style="width: 44px; height: 44px; border-radius: 999px; background: {{r.tint}}; font-weight: 600; display: flex; align-items: center; justify-content: center">{{r.i}}</span>
              <div style="flex: 1"><div style="font-size: 15px; font-weight: 600">{{r.who}}</div><div style="font-size: 13px; color: #6A6A6A">{{r.what}}</div></div>
            </div>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; gap: 8px; margin-top: 12px">
                <button onClick="{{r.decline}}" style="flex: 1; height: 42px; border-radius: 999px; border: 1px solid #222222; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: #222222">Decline</button>
                <button onClick="{{r.approve}}" style="flex: 1; height: 42px; border-radius: 999px; border: none; background: #C6F36B; color: #0E2F2C; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Approve</button>
              </div>
            </sc-if>
            <sc-if value="{{r.done}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 10px; font-size: 13px; font-weight: 600; color: {{r.doneColor}}">{{r.doneLabel}}</div>
            </sc-if>
          </div>
        </sc-for>
        <div style="font-size: 13px; font-weight: 600; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px">You asked</div>
        <div style="border-radius: 20px; border: 1px solid #EBEBEB; padding: 14px; display: flex; align-items: center; gap: 12px">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #FBE7D9; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">Food</div>
          <div style="flex: 1"><div style="font-size: 15px; font-weight: 600">Khao soi tasting tour</div><div style="font-size: 13px; color: #6A6A6A">Hosted by Sofía · sent 2 h ago</div></div>
          <span style="font-size: 12px; font-weight: 600; color: #9A5B00; background: #FDF1DC; border-radius: 999px; padding: 5px 10px">Pending</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{onChats}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{chats}}" as="c" hint-placeholder-count="3">
          <a href="Chat.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0F0F0; color: #222222">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: {{c.tint}}; flex: 0 0 52px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">{{c.tag}}</div>
            <div style="flex: 1; min-width: 0">
              <div style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">{{c.title}}</span><span style="font-size: 12px; color: #6A6A6A">{{c.time}}</span></div>
              <div style="font-size: 14px; color: #4A4A4A; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</div>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav style="height: 76px; border-top: 1px solid #EBEBEB; display: flex; align-items: center; justify-content: space-around; padding-bottom: 10px; box-sizing: border-box; background: #FFFFFF">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #6A6A6A; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #6A6A6A; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Discover</a>
    <a href="CreatePlan.dc.html" aria-label="Create a plan" style="width: 52px; height: 52px; border-radius: 999px; background: #C6F36B; display: flex; align-items: center; justify-content: center; margin-top: 4px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E2F2C" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="Inbox.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: #0E2F2C; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Inbox</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #6A6A6A; min-width: 56px; padding-top: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'req', dec: {} }; }
  renderVals() {
    const tab = this.state.tab, dec = this.state.dec;
    const base = [
      { id: 'a', i: 'L', tint: '#F3E3CF', who: 'Lena, 26 · Germany · ★ 4.9', what: 'Wants to join Chiang Mai Crew' },
      { id: 'b', i: 'D', tint: '#E6E1F3', who: 'Dan + 1 · USA · New', what: 'Asks 2 seats on Sunrise hike' }
    ];
    return {
      tabs: [{ k: 'req', label: 'Requests · 2' }, { k: 'chats', label: 'Chats' }].map((t) => ({
        label: t.label, bg: tab === t.k ? '#FFFFFF' : 'transparent', pick: () => this.setState({ tab: t.k })
      })),
      onReq: tab === 'req', onChats: tab === 'chats',
      incoming: base.map((r) => {
        const d = dec[r.id];
        return {
          ...r, open: !d, done: !!d,
          doneLabel: d === 'ok' ? 'Approved — added to chat' : 'Declined',
          doneColor: d === 'ok' ? '#1F7A4D' : '#6A6A6A',
          approve: () => this.setState({ dec: { ...dec, [r.id]: 'ok' } }),
          decline: () => this.setState({ dec: { ...dec, [r.id]: 'no' } })
        };
      }),
      chats: [
        { tag: 'Trip', tint: '#F3E3CF', title: 'Chiang Mai Crew', time: '10:24', last: 'Itay: booked the scooter for Pai' },
        { tag: 'Day trip', tint: '#DDEBF7', title: 'Elephant sanctuary', time: '09:02', last: 'Lena: see you at 8 by the 7-Eleven!' },
        { tag: 'Hike', tint: '#E3EFE6', title: 'Sunrise hike to Doi Suthep', time: 'Mon', last: 'You: bring headlamps' }
      ]
    };
  }
}
</script>
</body>
</html>
