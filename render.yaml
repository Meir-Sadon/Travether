# Render Blueprint: deploys the site and API as one free web service.
# Step-by-step instructions are in docs/DEPLOY.md.
services:
  - type: web
    name: travether
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Npgsql format, e.g. Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: ConnectionStrings__Default
        sync: false
      # cloudinary://<api_key>:<api_secret>@<cloud_name> (used from Phase 1; leave empty until then)
      - key: Cloudinary__Url
        sync: false
      # Signs session cookies, sign-up tokens and one-time-code hashes
      - key: Jwt__Secret
        generateValue: true
      # Google OAuth web client id; Google sign-in stays hidden while empty
      - key: Auth__GoogleClientId
        sync: false
      # Sign in with Apple services id and its registered redirect URI; hidden while empty
      - key: Auth__AppleClientId
        sync: false
      - key: Auth__AppleRedirectUri
        sync: false
      # Resend API key and sender; while empty, emails (sign-in codes) are only logged
      - key: Email__ResendApiKey
        sync: false
      - key: Email__From
        sync: false
      - key: Database__MigrateOnStartup
        value: "true"
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: AuthCookie__SameSite
        value: Lax
      - key: PORT
        value: "8080"
